<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Safety — NutriMama AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<style>
  .search-hero { text-align:center; padding: var(--space-6) 0; }
  .search-box { max-width:520px; margin:0 auto; display:flex; gap:.6rem; }
  .example-chip { background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-full); padding:.4rem .9rem; font-size:var(--text-sm); font-weight:600; cursor:pointer; }
  .example-chip:hover { border-color:var(--color-primary); }
  .result-card { max-width:640px; margin: var(--space-5) auto 0; }
  .confidence-bar { height:8px; background:var(--color-border); border-radius:var(--radius-full); overflow:hidden; margin-top:.3rem; }
  .confidence-fill { height:100%; background:var(--color-accent-dark); }
</style>
</head>
<body>
<div id="app-shell"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script>
const EXAMPLES = ['Coffee', 'Papaya', 'Pineapple', 'Paneer', 'Raw fish', 'Soft cheese'];
const BADGE_CLASS = { safe: 'badge-safe', moderation: 'badge-moderation', avoid: 'badge-avoid' };
const CLASS_LABEL = { safe: 'Safe', moderation: 'Consume in Moderation', avoid: 'Avoid' };

async function render() {
  const main = document.getElementById('app-main-content');
  main.innerHTML = `
    <div class="search-hero">
      <h1 style="font-size:var(--text-2xl);">🛡️ Food Safety Checker</h1>
      <p class="text-faint">Search any food to see if it's safe during pregnancy.</p>
      <form class="search-box" id="search-form">
        <input type="text" class="form-control" id="food-input" placeholder="e.g. sushi, coffee, papaya…" required>
        <button type="submit" class="btn btn-brand">Check</button>
      </form>
      <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
        ${EXAMPLES.map(f => `<span class="example-chip" data-food="${f}">${f}</span>`).join('')}
      </div>
    </div>
    <div id="result-slot"></div>
  `;

  document.querySelectorAll('.example-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.getElementById('food-input').value = chip.dataset.food;
      document.getElementById('search-form').dispatchEvent(new Event('submit', { cancelable: true }));
    });
  });

  document.getElementById('search-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const food = document.getElementById('food-input').value.trim();
    if (!food) return;
    const resultSlot = document.getElementById('result-slot');
    resultSlot.innerHTML = `<div class="result-card">${skeletonBlock('180px')}</div>`;

    try {
      const result = await Api.checkFoodSafety(food);
      resultSlot.innerHTML = `
        <div class="result-card card-soft">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h2 style="font-size:var(--text-xl); margin-bottom:0;">${escapeHtml(result.icon)} ${escapeHtml(result.food)}</h2>
            <span class="badge-soft ${BADGE_CLASS[result.classification] || ''}">${CLASS_LABEL[result.classification] || result.classification}</span>
          </div>
          <p>${escapeHtml(result.explanation)}</p>
          ${result.alternatives?.length ? `<p><strong>Alternatives:</strong> ${result.alternatives.map(escapeHtml).join(', ')}</p>` : ''}
          <div class="mb-2">
            <div class="d-flex justify-content-between" style="font-size:var(--text-xs); font-weight:700; color:var(--color-ink-faint);">
              <span>CONFIDENCE</span><span>${Math.round(result.confidence * 100)}%</span>
            </div>
            <div class="confidence-bar"><div class="confidence-fill" style="width:${result.confidence*100}%;"></div></div>
          </div>
          <p class="text-faint mb-0" style="font-size:var(--text-xs);">
  ${result.source_type === 'curated' ? '✅ Verified — curated database' : result.source_type === 'rag' ? '🤖 AI-assisted — backed by our knowledge base' : '⚠️ AI-assisted — not yet verified, confirm with your healthcare provider'}
</p>
          <p class="text-faint mb-0" style="font-size:var(--text-xs);"><strong>Sources:</strong> ${result.sources.map(escapeHtml).join('; ')}</p>
        </div>
      `;
    } catch (err) {
      resultSlot.innerHTML = `<div class="result-card alert alert-danger">${escapeHtml(err.message)}</div>`;
    }
  });
}
NutriMamaNav.mount('foodsafety').then(render);
</script>
</body>
</html>

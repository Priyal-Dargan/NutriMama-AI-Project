<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — NutriMama AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding: var(--space-4); }
  .auth-card { max-width:420px; width:100%; background:var(--color-surface); border-radius:var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--space-8); }
  .auth-brand { display:flex; align-items:center; gap:.6rem; justify-content:center; margin-bottom: var(--space-6); text-decoration:none; }
</style>
</head>
<body>
<div class="auth-card">
  <a href="index.html" class="auth-brand">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="var(--color-border)" stroke-width="3"/><path d="M16 3 A13 13 0 0 1 27.25 21.5" stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round"/><path d="M27.25 21.5 A13 13 0 0 1 16 29" stroke="var(--color-secondary)" stroke-width="3" stroke-linecap="round"/></svg>
    <span class="font-display" style="font-weight:600; font-size:var(--text-lg); color:var(--color-ink);">NutriMama AI</span>
  </a>
  <h2 class="text-center mb-1">Reset your password</h2>
  <p class="text-center text-faint mb-4" style="font-size:var(--text-sm);">Enter your email and we'll send you a reset link.</p>

  <div id="result-alert" class="alert d-none" style="border-radius:var(--radius-sm);"></div>

  <form id="forgot-form" novalidate>
    <div class="mb-4">
      <label class="form-label" for="email">Email</label>
      <input type="email" class="form-control" id="email" required autocomplete="email">
    </div>
    <button type="submit" class="btn btn-brand w-100" id="submit-btn">Send Reset Link</button>
  </form>

  <p class="text-center mt-4" style="font-size:var(--text-sm);"><a href="login.html">← Back to login</a></p>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('result-alert');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const result = await Api.forgotPassword({ email: document.getElementById('email').value.trim() });
      alertBox.className = 'alert alert-success';
      alertBox.style.borderRadius = 'var(--radius-sm)';
      alertBox.textContent = result.message || 'If that email is registered, a reset link has been sent.';
      // Dev-only convenience: this backend currently returns the token directly since
      // no email service is wired up yet (see backend README "Security Notes").
      if (result.reset_token_dev_only) {
        alertBox.innerHTML += `<br><br><small>Dev mode — no email service configured. Use this link:<br>
          <a href="reset-password.html?token=${encodeURIComponent(result.reset_token_dev_only)}">Reset your password</a></small>`;
      }
      alertBox.classList.remove('d-none');
      document.getElementById('forgot-form').reset();
    } catch (err) {
      alertBox.className = 'alert alert-danger';
      alertBox.style.borderRadius = 'var(--radius-sm)';
      alertBox.textContent = err.message || 'Something went wrong. Please try again.';
      alertBox.classList.remove('d-none');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>

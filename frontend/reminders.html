<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders — NutriMama AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<style>
  .reminder-item { display:flex; justify-content:space-between; align-items:center; padding: var(--space-3) var(--space-4); background:var(--color-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-md); margin-bottom: var(--space-2); }
  .reminder-item.completed { opacity:.55; }
  .reminder-type-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--color-primary-light); font-size:1rem; margin-right:.8rem; }
</style>
</head>
<body>
<div id="app-shell"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script>
const TYPE_ICONS = { meal:'🍽️', water:'💧', iron:'💊', calcium:'🥛', vitamin:'💊', exercise:'🏃', sleep:'😴', appointment:'🩺' };

async function render() {
  const main = document.getElementById('app-main-content');
  main.innerHTML = `
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <h1 style="font-size:var(--text-2xl); margin-bottom:0;">Reminders</h1>
      <button class="btn btn-brand" id="add-btn">+ Add Reminder</button>
    </div>

    <div class="card-soft mb-4 d-none" id="add-form-card">
      <h3>New reminder</h3>
      <form id="add-form">
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label">Type</label>
            <select class="form-select" id="reminder_type">
              <option value="meal">Meal</option>
              <option value="water">Water</option>
              <option value="iron">Iron supplement</option>
              <option value="calcium">Calcium</option>
              <option value="vitamin">Prenatal vitamin</option>
              <option value="exercise">Exercise</option>
              <option value="sleep">Sleep</option>
              <option value="appointment">Doctor appointment</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required placeholder="e.g. Take iron tablet">
          </div>
          <div class="col-md-2">
            <label class="form-label">Time</label>
            <input type="time" class="form-control" id="reminder_time" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Frequency</label>
            <select class="form-select" id="frequency">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="once">Once</option>
            </select>
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-brand">Save Reminder</button>
          <button type="button" class="btn btn-brand-outline" id="cancel-add-btn">Cancel</button>
        </div>
      </form>
    </div>

    <div id="reminder-list">${skeletonBlock('200px')}</div>
  `;

  document.getElementById('add-btn').addEventListener('click', () => document.getElementById('add-form-card').classList.remove('d-none'));
  document.getElementById('cancel-add-btn').addEventListener('click', () => document.getElementById('add-form-card').classList.add('d-none'));

  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await Api.createReminder({
        reminder_type: document.getElementById('reminder_type').value,
        title: document.getElementById('title').value.trim(),
        reminder_time: document.getElementById('reminder_time').value + ':00',
        frequency: document.getElementById('frequency').value,
      });
      toast('Reminder added!', 'success');
      e.target.reset();
      document.getElementById('add-form-card').classList.add('d-none');
      loadReminders();
    } catch (err) {
      toast(err.message || 'Failed to add reminder.', 'error');
    }
  });

  async function loadReminders() {
    const el = document.getElementById('reminder-list');
    try {
      const reminders = await Api.listReminders();
      if (!reminders.length) {
        el.innerHTML = `<p class="text-faint">No reminders yet. Add one above to get started.</p>`;
        return;
      }
      el.innerHTML = reminders.map(r => `
        <div class="reminder-item ${r.status === 'completed' ? 'completed' : ''}">
          <div class="d-flex align-items-center">
            <div class="reminder-type-icon">${TYPE_ICONS[r.reminder_type] || '⏰'}</div>
            <div>
              <div style="font-weight:600;">${escapeHtml(r.title)}</div>
              <div class="text-faint" style="font-size:var(--text-sm);">${r.reminder_time} · ${r.frequency}</div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-mint toggle-btn" data-id="${r.id}" data-status="${r.status}">${r.status === 'completed' ? 'Reopen' : 'Mark done'}</button>
            <button class="btn btn-sm btn-brand-outline delete-btn" data-id="${r.id}">Delete</button>
          </div>
        </div>
      `).join('');

      el.querySelectorAll('.toggle-btn').forEach(btn => btn.addEventListener('click', async () => {
        const newStatus = btn.dataset.status === 'completed' ? 'active' : 'completed';
        try {
          await Api.updateReminder(btn.dataset.id, { status: newStatus });
          loadReminders();
        } catch (err) { toast(err.message || 'Failed to update.', 'error'); }
      }));
      el.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async () => {
        try {
          await Api.deleteReminder(btn.dataset.id);
          toast('Reminder deleted', 'info');
          loadReminders();
        } catch (err) { toast(err.message || 'Failed to delete.', 'error'); }
      }));
    } catch (err) {
      el.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    }
  }

  loadReminders();
}
NutriMamaNav.mount('reminders').then(render);
</script>
</body>
</html>
